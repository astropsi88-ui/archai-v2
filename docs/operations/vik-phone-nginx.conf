# Installable owner client; existing music and preview routes preserved.
# Only the exact browser origin may use POST. Preserve the backend CSRF gate.
map "$request_method:$http_origin" $vik_phone_origin_allowed {
  default 0;
  "GET:" 1;
  "GET:https://vik.iarch.ai" 1;
  "POST:https://vik.iarch.ai" 1;
}

server {
  listen 80;
  listen [::]:80;
  server_name vik.iarch.ai;

  access_log /data/logs/vik-iarch-ai_access.log standard;
  error_log /data/logs/vik-iarch-ai_error.log warn;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/block-exploits.conf;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name vik.iarch.ai;

  http2 on;

  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/vik-iarch-ai/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/vik-iarch-ai/privkey.pem;

  access_log /data/logs/vik-iarch-ai_ssl_access.log standard;
  error_log /data/logs/vik-iarch-ai_ssl_error.log warn;

  include conf.d/include/block-exploits.conf;

  root /data/static/vik-iarch-ai;
  index vik-server.html;

  location = / {
    return 302 /vik/;
  }

  location ^~ /vik/ {
    index index.html;
    add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    try_files $uri $uri/ =404;
  }

  location ^~ /api/vik-site/ {
    if ($vik_phone_origin_allowed = 0) { return 403; }
    if ($uri !~ "^/api/vik-site/(history|chat|owner/auth|owner/secret-rotation|owner/audio/(transcribe|reply|session|pause|turn))$") { return 404; }
    client_max_body_size 8m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $vik_phone_backend http://vik-site-backend:8787;
    proxy_pass $vik_phone_backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Origin https://iarch.ai;
    proxy_set_header Referer https://iarch.ai/vik/;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 100s;
    proxy_read_timeout 110s;
    proxy_buffering off;
  }



  location = /vik-server {
    try_files /vik-server.html =404;
  }

  location = /privacy-policy {
    try_files /privacy-policy.html =404;
  }

  location ^~ /vik-preview/ {
    index index.html;
    try_files $uri $uri/ =404;
  }

  location / {
    try_files $uri $uri/ /vik-server.html;
  }
}
